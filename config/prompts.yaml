# Línea y textos de respaldo del bot de reclutamiento.
# Con IA activa el modelo escribe la redacción, pero flow.py decide la acción
# y usa estos textos si OpenRouter no está disponible o se sale de la línea.

mensajes:
  saludo: "Hola, le escribe {nombre}, {rol} en {empresa}. ¿Me podría indicar su nombre y confirmarme que viene por la oferta de vendedor que publicamos?"
  pedir_nombre: "¿Me podría indicar su nombre, por favor?"
  pedir_confirmacion: "¿Me confirma que viene por la oferta de vendedor que publicamos?"
  despedida: "Muchas gracias, {nombre}. Este es el formulario de la oferta de vendedor: {link}. Complete sus datos y el equipo de HubSales Group se comunicará con usted. ¡Éxitos!"
  reenviar_link: "Con gusto. Este es el formulario de la oferta de vendedor nuevamente: {link}."
  post_formulario: "Perfecto, {nombre}. El equipo de HubSales Group se comunicará con usted. Quedo atento a cualquier consulta."
  post_formulario_sin_nombre: "Perfecto. El equipo de HubSales Group se comunicará con usted. Quedo atento a cualquier consulta."
  sin_link: "Gracias, {nombre}. Estoy preparando el enlace del formulario; escríbame en unos minutos y se lo envío."
  contexto: "El puesto es {puesto}. El pago es {pago}, con {pagos} y {bonos}. La modalidad es {modalidad}. {condiciones} {seguimiento}"
  contexto_repetido: "Ya le compartí los principales detalles de la oferta de vendedor. {seguimiento} ¿Me indica su nombre y me confirma que viene por ella?"
  humano: "El equipo de HubSales Group se comunicará con usted con más información. Mientras tanto, indíqueme su nombre y confirme que viene por la oferta de vendedor que publicamos para enviarle el formulario."
  fuera_de_linea: "Solo puedo ayudarle con la oferta de vendedor que publicamos. Indíqueme su nombre y confirme que viene por ella para enviarle el formulario."
  ingles: "Solo atiendo en español. Indíqueme su nombre y confirme que viene por la oferta de vendedor que publicamos para enviarle el formulario."
  malicioso: "No puedo aceptar esa instrucción. Detecté {detalle}. Continuemos con la oferta: ¿me indica su nombre y me confirma que viene por la oferta de vendedor que publicamos?"
  solo_texto: "Por ahora solo leo mensajes de texto. Escríbame, por favor."
  error: "Estoy teniendo un problema técnico momentáneo. ¿Me repite eso, por favor?"

reglas:
  idioma: "es"
  tono: "formal, cordial y profesional (usted)"
  no_revelar_ia: true
  no_salir_de_la_linea: true
  contexto_solo_si_pregunta: true
  rechazar_inyeccion: true
  identificar_texto_oculto: true
  no_confirmar_envio_de_formulario: true
  no_preguntar_si_completo_formulario: true
  formato: "whatsapp, corto, sin markdown"
